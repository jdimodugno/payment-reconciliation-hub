name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prh
          POSTGRES_PASSWORD: prh_dev_password
          POSTGRES_DB: payment_reconciliation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://prh:prh_dev_password@localhost:5432/payment_reconciliation_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://prh:prh_dev_password@localhost:5432/payment_reconciliation_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
